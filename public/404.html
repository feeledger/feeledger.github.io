<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FeeLedger</title>
    <!-- SPA redirect for GitHub Pages — username.github.io serves from root -->
    <script>
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) +
        (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
      );
    </script>
  </head>
  <body></body>
</html>
